<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvalForge 页面原型</title>
<style>body { margin:0; background:#F5F7F7; }</style>
</head>
<body>
<div id="ef-product" lang="zh-CN">
  <aside class="ef-side">
    <div class="ef-brand"><span class="ef-mark" aria-hidden="true"><span></span><span></span><span></span></span><span>EvalForge</span></div>
    <nav aria-label="主导航" class="ef-nav">
      <button type="button" data-nav="experiments" aria-current="page">实验</button>
      <button type="button" data-nav="datasets">数据集</button>
      <button type="button" data-nav="runners">Runners</button>
    </nav>
    <button class="ef-side-end" type="button" data-nav="runners"><span class="ef-dot" aria-hidden="true"></span>查看 Runner 连接</button>
  </aside>
  <main class="ef-main">
    <div class="ef-top"><div id="ef-crumb"></div><span class="ef-demo">交互原型 · 演示数据</span></div>
    <div id="ef-view" class="ef-content"></div>
    <div id="ef-announcement" class="ef-sr" role="status"></div>
  </main>
  <dialog id="ef-modal" class="ef-modal" aria-labelledby="ef-modal-title" aria-describedby="ef-modal-description"></dialog>
</div>

<style>
  #ef-product {
    --page: #F5F7F7; --surface: #FFFFFF; --layer: #EFF2F2; --ink: #233139;
    --muted: #63727A; --accent: #466D75; --line: #DCE3E3; --tint: #E4EFF0;
    --ok: #386853; --ok-bg: #eaf3ed; --bad: #984d45; --bad-bg: #f7eeeb;
    --warn: #795f32; --warn-bg: #f7f2e6; --soft-line: #e9eeee;
    display:grid; grid-template-columns:170px minmax(0,1fr); min-height:100vh;
    background:var(--page); color:var(--ink); color-scheme:light;
    font: 14px/1.5 "Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
    text-align:left; letter-spacing:0;
  }
  #ef-product *, #ef-product *::before, #ef-product *::after { box-sizing:border-box; }
  #ef-product [hidden] { display:none !important; }
  #ef-product :is(button,input,select) { font:inherit; color:inherit; letter-spacing:inherit; }
  #ef-product button { cursor:pointer; }
  #ef-product button:disabled { cursor:default; opacity:.55; }
  #ef-product :is(button,input,select):focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #ef-product :is(h1,h2,h3,p,dl,dd) { margin:0; color:inherit; }
  #ef-product .ef-side { display:flex; flex-direction:column; background:var(--layer); border-right:1px solid var(--line); padding:0 12px; }
  #ef-product .ef-brand { display:flex; align-items:center; gap:9px; min-height:62px; padding-inline:8px; font-size:19px; font-weight:650; letter-spacing:-.7px; }
  #ef-product .ef-mark { flex:none; width:24px; height:24px; border-radius:5px; background:var(--accent); display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:2px; padding-left:6px; }
  #ef-product .ef-mark span { display:block; height:2px; width:12px; background:var(--surface); border-radius:1px; }
  #ef-product .ef-mark span:nth-child(2) { width:9px; }
  #ef-product .ef-mark span:nth-child(3) { width:5px; }
  #ef-product .ef-nav { display:grid; gap:3px; margin-top:12px; }
  #ef-product .ef-nav button, #ef-product .ef-side-end { background:none; border:0; text-align:left; min-height:38px; padding:0 10px; display:flex; gap:9px; align-items:center; border-radius:5px; white-space:nowrap; color:var(--muted); }
  #ef-product .ef-nav button:hover, #ef-product .ef-side-end:hover { background:var(--tint); color:var(--ink); }
  #ef-product .ef-nav button[aria-current] { background:var(--tint); color:var(--accent); font-weight:650; }
  #ef-product .ef-side-end { margin-top:auto; margin-bottom:13px; font-size:11.5px; }
  #ef-product .ef-dot { width:7px; height:7px; flex:none; border-radius:50%; background:#548475; }
  #ef-product .ef-main { min-width:0; }
  #ef-product .ef-top { height:54px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 27px; border-bottom:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:12px; }
  #ef-product #ef-crumb { display:flex; align-items:center; gap:8px; min-width:0; }
  #ef-product #ef-crumb > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ef-product .ef-demo { white-space:nowrap; border:1px solid var(--line); padding:2px 7px; border-radius:4px; font-size:11px; }
  #ef-product .ef-content { padding:28px 27px 30px; }
  #ef-product .ef-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; }
  #ef-product h1 { font-size:28px; line-height:1.22; font-weight:680; letter-spacing:-.7px; overflow-wrap:anywhere; }
  #ef-product h2 { font-size:16px; font-weight:650; }
  #ef-product .ef-heading p { margin-top:7px; color:var(--muted); font-size:13px; }
  #ef-product .ef-button { display:inline-flex; align-items:center; justify-content:center; flex:none; gap:6px; min-height:35px; padding:0 11px; background:var(--surface); border:1px solid var(--line); border-radius:5px; white-space:nowrap; font-size:13px; font-weight:600; }
  #ef-product .ef-button:hover { background:var(--layer); }
  #ef-product .ef-button.ef-primary { color:white; background:var(--accent); border-color:var(--accent); }
  #ef-product .ef-button.ef-primary:hover { background:#385b63; border-color:#385b63; }
  #ef-product .ef-text-button { background:none; border:0; padding:0; color:var(--accent); text-align:left; font-weight:620; overflow-wrap:anywhere; }
  #ef-product .ef-text-button:hover { text-decoration:underline; text-underline-offset:3px; }
  #ef-product .ef-panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; min-width:0; }
  #ef-product .ef-toolbar { display:flex; align-items:center; gap:8px; padding:12px 13px; }
  #ef-product .ef-search { display:flex; align-items:center; min-width:0; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:0 9px; color:var(--muted); }
  #ef-product .ef-search:focus-within { outline:2px solid var(--accent); outline-offset:1px; }
  #ef-product .ef-search input { border:0; outline:none; height:32px; width:146px; min-width:0; background:transparent; color:var(--ink); font-size:13px; padding:0; }
  #ef-product .ef-search input:focus-visible { outline:none; }
  #ef-product .ef-select, #ef-product .ef-input { min-height:34px; border:1px solid var(--line); border-radius:5px; background:var(--surface); padding:0 8px; min-width:0; font-size:13px; }
  #ef-product table { table-layout:fixed; width:100%; border-collapse:collapse; margin:0; color:var(--ink); font-size:13px; }
  #ef-product thead { background:var(--layer); }
  #ef-product th, #ef-product td { vertical-align:middle; text-align:left; padding:0 11px; overflow-wrap:anywhere; }
  #ef-product th:first-child, #ef-product td:first-child { padding-left:14px; }
  #ef-product thead th { font-size:11.5px; font-weight:630; height:33px; color:var(--muted); }
  #ef-product tbody td, #ef-product tbody th { height:55px; border-bottom:1px solid var(--soft-line); }
  #ef-product tbody tr:hover { background:#f8fbfb; }
  #ef-product .ef-row-main { display:block; color:var(--ink); font-size:13px; }
  #ef-product .ef-minor { display:block; margin-top:2px; color:var(--muted); font-size:11px; font-weight:400; }
  #ef-product .ef-date, #ef-product .ef-progress-value { white-space:nowrap; font-variant-numeric:tabular-nums; }
  #ef-product .ef-date { color:var(--muted); font-size:12px; }
  #ef-product .ef-badge { display:inline-flex; align-items:center; gap:5px; color:var(--muted); background:var(--layer); white-space:nowrap; padding:2px 7px; border-radius:4px; font-size:11.5px; font-weight:560; }
  #ef-product .ef-badge::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; }
  #ef-product .ef-badge.completed { color:var(--ok); background:var(--ok-bg); }
  #ef-product .ef-badge.running { color:var(--accent); background:var(--tint); }
  #ef-product .ef-badge.failed { color:var(--bad); background:var(--bad-bg); }
  #ef-product .ef-badge.cancelling { color:var(--warn); background:var(--warn-bg); }
  #ef-product .ef-track { display:block; height:3px; max-width:82px; margin-top:4px; overflow:hidden; border-radius:5px; background:var(--layer); }
  #ef-product .ef-track > span { display:block; height:100%; background:var(--accent); }
  #ef-product .ef-foot { padding:10px 14px; min-height:39px; display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
  #ef-product .ef-empty { text-align:center; color:var(--muted); padding:32px 12px; }
  #ef-product .ef-callout { background:var(--tint); border-radius:5px; padding:9px 11px; color:var(--accent); font-size:12px; }
  #ef-product .ef-inner { padding:16px; }
  #ef-product .ef-split { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(180px,1fr); gap:13px; align-items:start; }
  #ef-product .ef-head-status { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  #ef-product .ef-detail-count { font-size:28px; letter-spacing:-.8px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:10px; }
  #ef-product .ef-detail-count small { font-size:12px; color:var(--muted); font-weight:400; letter-spacing:0; margin-left:6px; }
  #ef-product .ef-detail-bar { height:8px; border-radius:4px; background:var(--layer); display:flex; overflow:hidden; margin:10px 0 12px; }
  #ef-product .ef-detail-bar .succeeded { background:#548475; } #ef-product .ef-detail-bar .failed { background:#b96f65; }
  #ef-product .ef-detail-bar .running { background:var(--accent); } #ef-product .ef-detail-bar .cancelled { background:#94a1a6; }
  #ef-product .ef-detail-bar .unknown { background:#b89a65; }
  #ef-product .ef-count-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:12px; }
  #ef-product .ef-count-grid div, #ef-product .ef-kv div { display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--soft-line); padding:8px 0; font-size:12px; }
  #ef-product .ef-count-grid dt, #ef-product .ef-kv dt { color:var(--muted); }
  #ef-product .ef-kv dd { text-align:right; overflow-wrap:anywhere; min-width:0; }
  #ef-product .ef-kv { margin-top:9px; }
  #ef-product .ef-form { display:grid; gap:13px; }
  #ef-product .ef-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  #ef-product .ef-field { display:grid; gap:5px; font-size:12px; font-weight:600; min-width:0; }
  #ef-product .ef-field > :is(input,select) { width:100%; font-weight:400; }
  #ef-product .ef-field input[readonly] { background:var(--layer); }
  #ef-product .ef-form label.ef-check { display:flex; align-items:center; gap:7px; font-size:13px; }
  #ef-product .ef-check input { accent-color:var(--accent); margin:0; }
  #ef-product .ef-form-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:7px; border-top:1px solid var(--soft-line); padding-top:13px; }
  #ef-product .ef-error { color:var(--bad); font-size:12px; }
  #ef-product .ef-resource-list { padding:0; margin:0; list-style:none; }
  #ef-product .ef-resource-list > li { border-bottom:1px solid var(--soft-line); }
  #ef-product .ef-resource-list > li:last-child { border-bottom:0; }
  #ef-product .ef-resource-button { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; padding:13px 15px; border:0; background:none; text-align:left; }
  #ef-product .ef-resource-button:hover { background:#f8fbfb; }
  #ef-product .ef-resource-button:focus-visible { outline-offset:-3px; }
  #ef-product .ef-resource-button .ef-row-main { font-weight:620; }
  #ef-product .ef-resource-trailing { display:flex; align-items:center; gap:9px; flex:none; color:var(--muted); }
  #ef-product .ef-modal { box-sizing:border-box; width:min(440px,calc(100% - 24px)); max-width:none; max-height:calc(100% - 24px); margin:auto; padding:0; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); box-shadow:0 16px 48px #2331392e; }
  #ef-product .ef-modal[open], #ef-product .ef-modal-form { display:flex; flex-direction:column; min-height:0; }
  #ef-product .ef-modal::backdrop { background:#23313956; }
  #ef-product .ef-modal[data-kind="create"] { width:min(680px,calc(100% - 24px)); }
  #ef-product .ef-modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 19px; border-bottom:1px solid var(--line); flex:none; }
  #ef-product .ef-modal-head h2 { font-size:19px; line-height:1.3; overflow-wrap:anywhere; }
  #ef-product .ef-modal-head p { color:var(--muted); font-size:12px; margin-top:4px; }
  #ef-product .ef-close { display:grid; place-items:center; flex:none; width:32px; height:32px; padding:0; border:0; border-radius:5px; background:transparent; color:var(--muted); font-size:22px; line-height:1; }
  #ef-product .ef-close:hover { color:var(--ink); background:var(--layer); }
  #ef-product .ef-modal-body { min-height:0; overflow:auto; overscroll-behavior:contain; padding:16px 19px; }
  #ef-product .ef-modal-body > .ef-kv { margin-top:0; }
  #ef-product .ef-modal-body > .ef-kv div:first-child { border-top:0; padding-top:0; }
  #ef-product .ef-create-body { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(148px,1fr); gap:16px; align-items:start; }
  #ef-product .ef-estimate { padding:11px 13px; border-radius:6px; background:var(--page); }
  #ef-product .ef-estimate h3 { font-size:13px; font-weight:650; }
  #ef-product .ef-modal-foot { display:flex; justify-content:flex-end; gap:8px; flex:none; border-top:1px solid var(--line); padding:11px 19px; }
  #ef-product .ef-verify { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:9px 10px; margin-top:12px; background:var(--warn-bg); border-radius:5px; color:var(--warn); font-size:12px; }
  #ef-product .ef-sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
  #ef-product .ef-stack { display:grid; gap:14px; }
  #ef-product .ef-section-head { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:10px; }
  #ef-product .ef-table-wrap { overflow-x:auto; }
  #ef-product .ef-jobs { min-width:490px; }
  #ef-product .ef-jobs th:first-child { width:27%; }
  #ef-product .ef-pager { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  #ef-product .ef-pager button { min-height:30px; }
  #ef-product .ef-badge.succeeded { color:var(--ok); background:var(--ok-bg); }
  #ef-product :is(.ef-badge.assigned,.ef-badge.unknown) { color:var(--warn); background:var(--warn-bg); }
  #ef-product .ef-modal:is([data-kind="dataset"],[data-kind="job"],[data-kind="import"]) { width:min(660px,calc(100% - 24px)); }
  #ef-product .ef-preview { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  #ef-product .ef-preview-item { min-width:0; padding:10px; border:1px solid var(--line); border-radius:6px; }
  #ef-product .ef-preview-item h3 { font-size:12px; color:var(--muted); }
  #ef-product .ef-preview-item pre { margin:6px 0 0; max-height:190px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.5 Consolas,monospace; }
  #ef-product .ef-sample { display:grid; gap:8px; padding:9px 0 14px; border-bottom:1px solid var(--soft-line); }
  #ef-product .ef-sample summary { cursor:pointer; font-weight:600; }
  #ef-product .ef-sample[open] summary { margin-bottom:8px; }
  #ef-product .ef-foot.ef-inset-foot { padding-inline:0; }
  #ef-product .ef-field small, #ef-product .ef-caption { color:var(--muted); font-size:12px; font-weight:400; }
  #ef-product .ef-checks { display:flex; gap:8px 16px; flex-wrap:wrap; min-width:0; margin:0; padding:8px 10px 10px; border:1px solid var(--line); border-radius:5px; }
  #ef-product .ef-checks legend { padding-inline:4px; }
  #ef-product .ef-file { max-width:100%; padding-block:6px; }
  @media(max-width:790px) {
    #ef-product { grid-template-columns:137px minmax(0,1fr); }
    #ef-product .ef-content, #ef-product .ef-top { padding-inline:17px; }
    #ef-product .ef-side { padding-inline:8px; }
    #ef-product .ef-side-end { padding-inline:5px; }
    #ef-product th, #ef-product td { padding-inline:6px; }
  }
  @media(max-width:630px) {
    #ef-product { grid-template-columns:minmax(0,1fr); min-height:0; }
    #ef-product .ef-side { border-right:0; border-bottom:1px solid var(--line); padding:0 12px 6px; }
    #ef-product .ef-brand { min-height:43px; padding-inline:1px; }
    #ef-product .ef-nav { display:flex; gap:3px; flex-wrap:wrap; margin-top:0; }
    #ef-product .ef-nav button { min-height:34px; }
    #ef-product .ef-side-end { display:none; }
    #ef-product .ef-top { height:35px; }
    #ef-product .ef-content { padding:18px 12px; }
    #ef-product .ef-heading { gap:7px; margin-bottom:16px; }
    #ef-product h1 { font-size:23px; }
    #ef-product .ef-heading p { font-size:12px; }
    #ef-product .ef-heading .ef-button { padding-inline:7px; }
    #ef-product .ef-split { grid-template-columns:minmax(0,1fr); }
    #ef-product .ef-toolbar { flex-wrap:wrap; padding:8px; }
    #ef-product .ef-search { flex:1 1 120px; }
    #ef-product .ef-search input { width:100%; }
    #ef-product .ef-select { flex:0 0 auto; }
    #ef-product .ef-exps :is(thead th,tbody td):last-child { display:none; }

    #ef-product .ef-exps col:first-child { width:40% !important; }
    #ef-product .ef-exps col:nth-child(2) { width:23% !important; }
    #ef-product .ef-exps col:nth-child(3) { width:22% !important; }
    #ef-product .ef-exps col:nth-child(4) { width:15% !important; }
    #ef-product .ef-exps col:last-child { width:0 !important; }
    #ef-product .ef-exps th:first-child { padding-left:8px; }
    #ef-product .ef-badge { gap:3px; padding-inline:4px; font-size:11px; }
    #ef-product .ef-progress-value { font-size:11px; }
  }
  @media (pointer:coarse) {
    #ef-product .ef-nav button, #ef-product .ef-button, #ef-product .ef-select, #ef-product .ef-input, #ef-product .ef-search input { min-height:44px; }

    #ef-product .ef-resource-button .ef-row-main { min-height:0; }

    #ef-product .ef-create-body { grid-template-columns:minmax(0,1fr); gap:12px; }
    #ef-product .ef-preview { grid-template-columns:minmax(0,1fr); }

    #ef-product .ef-estimate .ef-kv { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:10px; }
  }
</style>
<script>
(() => {
  const root = document.querySelector("#ef-product");
  const screen = root.querySelector("#ef-view");
  const modal = root.querySelector("#ef-modal");
  const labels = { pending:"排队中", running:"运行中", completed:"已完成", failed:"失败", cancelling:"取消中", cancelled:"已取消" };
  const jobLabels = { queued:"排队中", assigned:"已分配", running:"运行中", succeeded:"成功", failed:"失败", cancelled:"已取消", unknown:"未知" };
  const datasets = [
    { id:12, name:"客服问答集", version:3, desc:"产品政策、售后和订单问答。", evaluation:"答案匹配", evalId:5,
      samples:[
        { input:{question:"退款多久到账？"}, output:{answer:"退款通常在 3–5 个工作日内到账。"}, metadata:{category:"售后"} },
        { input:{question:"订单在哪里查？"}, output:{answer:"可在「我的订单」查看。"}, metadata:{category:"订单"} },
        { input:{question:"怎么修改收货地址？"}, output:{answer:"请在订单发货前修改。"}, metadata:{category:"物流"} },
        { input:{question:"如何申请电子发票？"}, output:{answer:"请在订单详情申请。"}, metadata:{category:"发票"} }
      ] },
    { id:15, name:"RAG 检索集", version:8, desc:"检索结果与参考文档。", evaluation:"检索召回", evalId:6,
      samples:[
        { input:{query:"退款政策"}, output:{document_ids:["refund-01","refund-02"]}, metadata:{k:3} },
        { input:{query:"变更收货地址"}, output:{document_ids:["shipping-01"]}, metadata:{k:3} },
        { input:{query:"电子发票"}, output:{document_ids:["invoice-01"]}, metadata:{k:3} }
      ] },
    { id:18, name:"流式样本集", version:11, desc:"验证流式请求和最终响应。",
      samples:[{input:{prompt:"用一句话介绍 EvalForge。"},output:{answer:"EvalForge 用于评测 Agent。"},metadata:{}}] },
    { id:20, name:"空数据集", version:null, desc:"用于展示无版本状态。", samples:[] }
  ];
  // Historical snapshots are reachable from experiments that already reference them.

  const runners = [

    form.querySelector('[type="submit"]').disabled = true;
    form.querySelector("#ef-import-fields").innerHTML = form.elements.format.value === "csv"
      ? '<p class="ef-caption">上传带表头的 CSV 后，将列分配给请求输入、参考输出或元数据。至少选一列作为请求输入。</p>'
      : '<p class="ef-caption">每行一个 JSON 对象。input 必填，output 和 metadata 可省略；三者都应是对象。</p>' +
        json("JSONL 单行示例",{input:{question:"你好"},output:{answer:"你好"},metadata:{}});
    setError(form,"");
  }
  // Local preview only. The backend remains responsible for validating real uploads.
  function csvRows(text) {
    const rows = []; let row = [], value = "", quoted = false, closed = false;
    const cell = () => {row.push(value); value = ""; closed = false;};
    const line = () => {cell(); rows.push(row); row = [];};
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c !== '"') value += c;
        else if (text[i+1] === '"') {value += c; i++;}
        else {quoted = false; closed = true;}
      } else if (c === ",") cell();
      else if (c === "\n" || c === "\r") {if (c === "\r" && text[i+1] === "\n") i++; line();}
      else if (c === '"' && !value && !closed) quoted = true;
      else if (closed || c === '"') throw new Error("CSV 引号格式不正确。");
      else value += c;
    }
    if (quoted) throw new Error("CSV 有未闭合的引号。");
    if (row.length || value || closed) line();
    return rows;
  }
  async function prepareImport(form) {
    resetImport(form);
    const file = form.elements.file.files[0], format = form.elements.format.value;
    if (!file) return;
    const isCurrent = () => form.isConnected && form.elements.file.files[0] === file && form.elements.format.value === format;
    try {
      if (file.size > 5 * 1024 * 1024) throw new Error("文件超过 5 MiB。");
      const text = new TextDecoder("utf-8",{fatal:true}).decode(await file.arrayBuffer());
      if (!isCurrent()) return;
      const fields = form.querySelector("#ef-import-fields");
      if (format === "csv") {
        const [rawHeader,...lines] = csvRows(text);
        const header = (rawHeader ?? []).map(name => name.trim());
        if (!header.length || header.length > 256 || header.includes("") || new Set(header).size !== header.length) {
          throw new Error("CSV 表头最多 256 列，列名不能为空或重复。");
        }
        const rows = lines.filter(row => row.length > 1 || row[0] !== "");
        if (rows.some(row => row.length !== header.length)) throw new Error("CSV 数据行与表头的列数不一致。");
        if (!rows.length || rows.length > 10000) throw new Error("请提供 1–10,000 条样本。");
        importData.set(form,{header,rows});
        fields.innerHTML += '<div class="ef-fields">' + header.map((name,i) => '<label class="ef-field">' + safe(name) +
          '<select class="ef-select" name="column" data-col="' + i + '"><option value="">忽略</option><option value="input">请求输入</option>' +
          '<option value="output">参考输出</option><option value="metadata">元数据</option></select></label>').join("") + '</div>';
      } else {
        const samples = text.split(/\r?\n/).flatMap((line,i) => {
          if (!line.trim()) return [];
          try {
            const item = JSON.parse(line), isObject = value => value !== null && typeof value === "object" && !Array.isArray(value);
            if (!isObject(item) || !isObject(item.input) || ["output","metadata"].some(key => Object.hasOwn(item,key) && !isObject(item[key]))) throw new Error();
            return [{input:item.input,output:item.output ?? {},metadata:item.metadata ?? {}}];
          } catch { throw new Error("JSONL 第 " + (i+1) + " 行格式不正确。"); }
        });
        if (!samples.length || samples.length > 10000) throw new Error("请提供 1–10,000 条样本。");
        importData.set(form,{samples});
        fields.innerHTML += '<p class="ef-caption">已读取 ' + samples.length + ' 条样本。</p>';
      }
      form.querySelector('[type="submit"]').disabled = false;
    } catch (error) {
      if (isCurrent()) setError(form,error instanceof TypeError ? "无法读取文件，请确认编码是 UTF-8。" : error.message);
    }
  }
  function importDataset(form) {
    const data = importData.get(form), name = form.elements.name.value.trim();
    if (!name || !data) return setError(form,"请输入名称并选择可读取的文件。");
    if (datasets.some(d => d.name === name)) return setError(form,"数据集名称已存在。");
    let {samples} = data;
    if (!samples) {
      const groups = Array.from(form.querySelectorAll("[data-col]"), field => field.value);
      if (!groups.includes("input")) return setError(form,"至少选一列作为请求输入。");
      samples = data.rows.map(row => Object.fromEntries(["input","output","metadata"].map(group => [group,
        Object.fromEntries(data.header.flatMap((key,i) => groups[i] === group ? [[key,row[i]]] : []))])));
    }
    const d = {id:Math.max(...datasets.map(item => item.id))+1, version:Math.max(...datasets.map(item => item.version ?? 0))+1,
      name, desc:form.elements.description.value.trim(), samples};
    datasets.unshift(d);
    state.datasetPage = 1;
    render();
    datasetDialog(d);
    modal.querySelector("#ef-sample-title").focus();
    announce("已导入演示数据集");
  }
  function navigate(view, id = null) {
    if (modal.open) modal.close();
    Object.assign(state,{view, exp:id, jobPage:1, jobStatus:"", confirm:false});
    render(true);
  }
  root.addEventListener("click", event => {
    const el = event.target.closest("button");
    if (!el) return;
    const a = el.dataset;
    if (a.nav) return navigate(a.nav);
    if (a.open) return navigate("detail",Number(a.open));
    if (a.dataset) {
      const d = findData(a.dataset);
      return datasetDialog(d,a.version ? Number(a.version) : d.version);
    }
    if (a.job) return jobDialog(current().jobs.find(job => job.id === a.job));
    if (a.runner) return runnerDialog(runners.find(r => r.id === a.runner));
    if (a.experiments) {
      state.dataset = Number(a.experiments);
      state.expPage = 1;
      return navigate("experiments");
    }
    if (a.pageKey === "samplePage") {
      const {id,version,page} = modal.dataset;
      return datasetDialog(findData(id),version ? Number(version) : null,Number(page)+Number(a.delta),true);
    }
    if (a.pageKey) {
      state[a.pageKey] += Number(a.delta);
      render();
      const pager = screen.querySelector('[data-page-key="' + a.pageKey + '"][data-delta="' + a.delta + '"]');
      (pager.disabled ? pager.parentElement.querySelector("button:not(:disabled)") : pager)?.focus();
      return;
    }
    switch (a.action) {
      case "create": return createDialog();
      case "import": return importDialog();
      case "close": return modal.close();
      case "confirm-cancel":
      case "keep":
        state.confirm = a.action === "confirm-cancel";
        render();
        return screen.querySelector(state.confirm ? '[data-action="keep"]' : '[data-action="confirm-cancel"]').focus();
      case "cancel": {
        const e = current();
        e.jobs.filter(job => !terminal(job)).forEach(job => {job.status = "cancelled";});
        e.status = "cancelled";
        Object.assign(state,{confirm:false,jobStatus:"",jobPage:1});
        render(true);
        return announce("已取消演示实验");
      }
    }
  });
  modal.addEventListener("close", () => {if (!modal.open) modal.replaceChildren();});
  root.addEventListener("change", ({target}) => {
    if (target.id === "ef-dataset-filter") {
      Object.assign(state,{dataset:Number(target.value),expPage:1});
      render();
      screen.querySelector("#ef-dataset-filter").focus();
    } else if (target.id === "ef-job-status") {
      Object.assign(state,{jobStatus:target.value,jobPage:1});
      render();
      screen.querySelector("#ef-job-status").focus();
    } else if (target.form?.id === "ef-create-form") updateCreate(target.name === "dataset");
    else if (target.form?.id === "ef-import-form") {
      if (target.name === "format") {
        target.form.elements.file.value = "";
        target.form.elements.file.accept = "." + target.value;
        resetImport(target.form);
      } else if (target.name === "file") prepareImport(target.form);
    }
  });
  root.addEventListener("input", ({target}) => {
    if (target.form?.id === "ef-create-form" && target.name === "repetitions") updateCreate();
  });
  root.addEventListener("submit", event => {
    event.preventDefault();
    if (event.target.id === "ef-create-form") createExperiment(event.target);
    if (event.target.id === "ef-import-form") importDataset(event.target);
  });
  render();
})();
</script>
</body>
</html>
