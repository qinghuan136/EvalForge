[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "0.1.0"
description = "A small, offline Dataset → Task → Evaluator experiment runner"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
include = ["evalforge*"]
