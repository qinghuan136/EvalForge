[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "0.1.0"
description = "A small, offline Dataset → Task → Evaluator experiment runner"
requires-python = ">=3.11"
license-files = ["third_party/phoenix-*/LICENSE*", "third_party/phoenix-*/IP_NOTICE"]
dependencies = [
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.32,<1",
    "redis>=8.1,<9",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "argon2-cffi>=25.1,<26",
    "anyio>=4.9,<5",
    "websockets>=15,<18",
    "jsonrpcserver>=5.0.9,<6",
    "jsonrpcclient>=4.0.3,<5",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "aiosqlite>=0.21,<1",
    "fakeredis[lua]>=2.30,<3",
    "cryptography>=46,<49",
]

[tool.setuptools.packages.find]
include = ["evalforge*"]
